<style>
/* ──────────────────────────────────────────────────────────────────────────
   CheckTheWorld · editorial dark dashboard
   ────────────────────────────────────────────────────────────────────────── */

:root {
  --bg: #131310;
  --card: #1f1f1b;
  --card-2: #1a1a17;
  --border: #2c2c26;
  --border-soft: #25251f;
  --text: #ece9df;
  --text-2: #b6b1a3;
  --text-3: #7d786c;
  --accent: #3fbb89;
  --amber: #f0a54a;
  --gap: 24px;
  --graticule: 0.6;
  --glow: 1;
  --serif: "Playfair Display", "Times New Roman", serif;
  --sans: "Manrope", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button {
  font-family: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}

ul { list-style: none; padding: 0; margin: 0; }

/* ────────── App shell ────────── */

.app {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(63,187,137,0.045), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(240,165,74,0.035), transparent 60%),
    var(--bg);
}

/* ────────── Sidebar ────────── */

.sidebar {
  width: 220px;
  border-right: 1px solid var(--border);
  padding: 28px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  background: rgba(15,15,13,0.6);
  backdrop-filter: blur(8px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px;
}
.brand-mark {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: #181814;
  border: 1px solid var(--border);
  border-radius: 10px;
}
.brand-name {
  font-family: var(--serif);
  font-size: 17px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.brand-sub {
  font-size: 10.5px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-top: 2px;
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 13.5px;
  color: var(--text-2);
  text-align: left;
  transition: all 160ms ease;
  position: relative;
}
.nav-item:hover {
  background: #1a1a17;
  color: var(--text);
}
.nav-item.active {
  background: linear-gradient(180deg, rgba(63,187,137,0.10), rgba(63,187,137,0.04));
  color: var(--text);
  box-shadow: inset 0 0 0 1px rgba(63,187,137,0.18);
}
.nav-item.active svg { color: var(--accent); }
.nav-dot {
  position: absolute;
  right: 10px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}

.sidebar-foot { margin-top: auto; }
.user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--card);
}
.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #3fbb89, #2a7a5a);
  color: #0d1f17;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
}
.user-name { font-size: 12.5px; color: var(--text); }
.user-meta { font-size: 10.5px; color: var(--text-3); margin-top: 1px; }

/* ────────── Main ────────── */

.main {
  min-width: 0;
}
.main-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 36px 40px 60px;
  display: flex;
  flex-direction: column;
  gap: var(--gap);
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border-soft);
  margin-bottom: 6px;
}
.eyebrow {
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 8px;
}
.page-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 38px;
  line-height: 1.05;
  margin: 0;
  letter-spacing: -0.015em;
  color: var(--text);
}
.page-title::after {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--amber);
  border-radius: 50%;
  margin-left: 8px;
  transform: translateY(-12px);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-2);
  display: grid;
  place-items: center;
  position: relative;
  transition: all 160ms ease;
}
.icon-btn:hover {
  color: var(--text);
  border-color: #3a3a32;
}
.bell-dot {
  position: absolute;
  top: 9px;
  right: 10px;
  width: 6px;
  height: 6px;
  background: var(--amber);
  border-radius: 50%;
  border: 1.5px solid var(--card);
}
.primary-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--accent);
  color: #0c1f17;
  font-weight: 600;
  font-size: 13px;
  border: 1px solid rgba(63,187,137,0.6);
  transition: all 160ms ease;
}
.primary-btn:hover {
  filter: brightness(1.08);
  box-shadow: 0 0 0 4px rgba(63,187,137,0.12);
}

/* ────────── Cards ────────── */

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px 24px;
  transition: border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
}
.card:hover {
  border-color: #34342c;
  box-shadow: 0 0 0 calc(1px * var(--glow)) rgba(63,187,137,0.18),
              0 8px 30px -12px rgba(63,187,137,calc(0.15 * var(--glow)));
}

.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.card-eyebrow {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 6px;
}
.card-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 22px;
  line-height: 1.1;
  margin: 0;
  letter-spacing: -0.01em;
}

.ghost-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-2);
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid transparent;
  transition: all 160ms ease;
}
.ghost-btn:hover {
  border-color: var(--border);
  color: var(--text);
}

/* ────────── Stats row ────────── */

.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--gap);
}
.stat-card {
  padding: 22px 22px 20px;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(400px 80px at 100% 0%, rgba(63,187,137,0.06), transparent 60%);
  pointer-events: none;
}
.stat-label {
  font-size: 10.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
}
.stat-value-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 14px;
}
.stat-value {
  font-family: var(--serif);
  font-size: 38px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--text);
  font-feature-settings: "lnum", "tnum";
}
.stat-delta {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid currentColor;
  letter-spacing: 0.02em;
}
.stat-delta.green { color: var(--accent); border-color: rgba(63,187,137,0.4); background: rgba(63,187,137,0.08); }
.stat-delta.amber { color: var(--amber); border-color: rgba(240,165,74,0.4); background: rgba(240,165,74,0.08); }
.stat-foot {
  margin-top: 14px;
  font-size: 11.5px;
  color: var(--text-3);
}

/* ────────── Half cards ────────── */

.halves {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
}
.half-card { padding: 22px 24px 14px; }

.fav-list, .visa-list {
  display: flex;
  flex-direction: column;
}

.fav-row {
  display: grid;
  grid-template-columns: 28px 36px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 4px;
  border-top: 1px solid var(--border-soft);
  cursor: pointer;
  transition: all 160ms ease;
  color: var(--text);
}
.fav-row:first-child { border-top: none; }
.fav-row:hover { background: rgba(255,255,255,0.015); }
.fav-row:hover svg { color: var(--amber); }
.fav-rank {
  font-family: var(--serif);
  font-size: 14px;
  color: var(--text-3);
  letter-spacing: 0.02em;
}
.fav-name {
  font-size: 14px;
  color: var(--text);
}
.fav-note {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 1px;
}
.fav-row svg { color: var(--text-3); }

.flag-dot {
  width: 36px;
  height: 26px;
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: rgba(255,255,255,0.7);
  border: 1px solid rgba(255,255,255,0.06);
}

/* Visa list */
.visa-row {
  display: grid;
  grid-template-columns: 38px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 14px 4px;
  border-top: 1px solid var(--border-soft);
}
.visa-row:first-child { border-top: none; }
.visa-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}
.visa-name { font-size: 14px; color: var(--text); }
.visa-meta { font-size: 11.5px; color: var(--text-3); margin-bottom: 8px; }
.visa-bar {
  height: 3px;
  background: #2a2a23;
  border-radius: 2px;
  overflow: hidden;
}
.visa-bar-fill { height: 100%; border-radius: 2px; }
.visa-bar-fill.green { background: var(--accent); }
.visa-bar-fill.amber { background: var(--amber); }
.visa-bar-fill.muted { background: #4a4a40; }
.visa-days {
  text-align: right;
  font-family: var(--serif);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}
.visa-days b {
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
  font-feature-settings: "lnum", "tnum";
}
.visa-days span {
  font-family: var(--sans);
  font-size: 10px;
  color: var(--text-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.pill {
  font-size: 10px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 999px;
  letter-spacing: 0.04em;
  border: 1px solid currentColor;
}
.pill.green { color: var(--accent); background: rgba(63,187,137,0.08); border-color: rgba(63,187,137,0.35); }
.pill.amber { color: var(--amber); background: rgba(240,165,74,0.08); border-color: rgba(240,165,74,0.35); }
.pill.muted { color: var(--text-3); background: rgba(255,255,255,0.02); border-color: var(--border); }
.dim { color: var(--text-3); }

/* ────────── Map ────────── */

.map-card { padding: 22px 24px 18px; }
.map-head { margin-bottom: 14px; }
.legend {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 11.5px;
  color: var(--text-2);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.sw {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
}
.sw.green { background: var(--accent); }
.sw.amber { background: var(--amber); }
.sw.gray { background: #3a3a32; }

.map-wrap {
  position: relative;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid var(--border-soft);
  background: linear-gradient(180deg, #161614, #0f0f0d);
}
.map-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--text-3);
  font-size: 13px;
  letter-spacing: 0.04em;
}
.map-loading.err { color: var(--amber); }
.world-svg {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1000 / 500;
}
.world-svg .graticule { opacity: var(--graticule); }
.country {
  fill: #2a2a24;
  stroke: #131310;
  stroke-width: 0.5;
  transition: fill 160ms ease, filter 160ms ease;
  cursor: pointer;
}
.country.visited {
  fill: var(--accent);
  fill-opacity: 0.8;
}
.country.favorite {
  fill: var(--amber);
  fill-opacity: 0.78;
}
.country:hover {
  fill: #fff;
  filter: drop-shadow(0 0 6px rgba(63,187,137,calc(0.55 * var(--glow))));
}
.country.visited:hover { fill: #5fd8a3; }
.country.favorite:hover { fill: #ffc070; }

.map-tip {
  position: absolute;
  pointer-events: none;
  background: rgba(20,20,17,0.96);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  backdrop-filter: blur(6px);
  z-index: 10;
}
.tip-name { font-weight: 600; }
.tip-status { font-size: 10.5px; margin-top: 3px; color: var(--text-3); }
.tip-status.visited { color: var(--accent); }
.tip-status.favorite { color: var(--amber); }

.map-foot {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--border-soft);
}
.map-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.map-stat b {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}
.map-stat span {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--text-3);
}

/* ────────── Achievements ────────── */

.achv-card { padding: 22px 24px 20px; }
.achv-progress { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--text-3); }
.achv-bar { width: 100px; height: 3px; background: #2a2a23; border-radius: 2px; overflow: hidden; }
.achv-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }

.achv-row {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
}
.achv {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: var(--card-2);
  transition: all 200ms ease;
  position: relative;
  overflow: hidden;
}
.achv.on::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(80px 60px at 50% 0%, rgba(63,187,137,0.18), transparent 60%);
  pointer-events: none;
}
.achv.off { opacity: 0.55; }
.achv-icon {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: rgba(63,187,137,0.08);
  color: var(--accent);
  border: 1px solid rgba(63,187,137,0.2);
}
.achv.off .achv-icon {
  background: rgba(255,255,255,0.02);
  color: var(--text-3);
  border-color: var(--border);
}
.achv-title { font-size: 13.5px; color: var(--text); font-weight: 500; }
.achv-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }

/* ────────── Modal ────────── */

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(8,8,7,0.7);
  backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  z-index: 100;
  animation: fade 200ms ease;
}
.modal {
  width: 440px;
  max-width: calc(100vw - 32px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 28px 28px 22px;
  position: relative;
  box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6),
              0 0 0 1px rgba(63,187,137,0.12);
  animation: slideUp 240ms cubic-bezier(.2,.8,.2,1);
}
.modal-close {
  position: absolute;
  top: 14px; right: 14px;
  width: 30px; height: 30px;
  border-radius: 8px;
  display: grid; place-items: center;
  color: var(--text-3);
  border: 1px solid transparent;
}
.modal-close:hover { color: var(--text); border-color: var(--border); }
.modal-eyebrow {
  font-size: 10.5px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-3);
}
.modal-title {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 30px;
  margin: 6px 0 12px;
  letter-spacing: -0.015em;
}
.modal-meta { font-size: 12px; color: var(--text-2); margin-bottom: 18px; }

.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 18px;
}
.modal-btn {
  display: grid;
  grid-template-columns: 32px 1fr;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card-2);
  text-align: left;
  transition: all 160ms ease;
  color: var(--text);
}
.modal-btn:hover { border-color: #3a3a32; background: #1c1c19; }
.modal-btn.green:hover { border-color: rgba(63,187,137,0.4); }
.modal-btn.amber:hover { border-color: rgba(240,165,74,0.4); }
.modal-btn .ma-title { font-size: 13.5px; font-weight: 500; }
.modal-btn .ma-sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.modal-btn.green > svg:first-child { color: var(--accent); }
.modal-btn.amber > svg:first-child { color: var(--amber); }
.modal-btn.ghost > svg:first-child { color: var(--text-3); }

.modal-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  color: var(--text-2);
  padding-top: 14px;
  border-top: 1px solid var(--border-soft);
}

/* ────────── Footer ────────── */

.foot {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.04em;
  padding-top: 12px;
  border-top: 1px solid var(--border-soft);
  margin-top: 8px;
}

/* ────────── Animations ────────── */

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ────────── Scrollbar ────────── */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a23; border-radius: 10px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: #3a3a32; }

/* ────────── Tweaks panel overrides (accept theme) ────────── */
.tweaks-panel {
  background: var(--card) !important;
  border-color: var(--border) !important;
  color: var(--text) !important;
  font-family: var(--sans) !important;
}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

function StatCard({ label, value, delta, accent, foot }) {
  return (
    <div className="stat-card card">
      <div className="stat-label">{label}</div>
      <div className="stat-value-row">
        <div className="stat-value">{value}</div>
        {delta && <div className={`stat-delta ${accent}`}>{delta}</div>}
      </div>
      <div className="stat-foot">{foot}</div>
    </div>
  );
}

function StatsRow({ visitedCount, favCount, visas }) {
  const now = Date.now();
  const dl = v => Math.ceil((new Date(v.entry).getTime() + v.allowed*86400000 - now)/86400000);
  const activeVisas = (visas||[]).filter(v => dl(v) > 0);
  const expiringVisa = activeVisas.sort((a,b) => dl(a)-dl(b))[0];
  const activeCount = activeVisas.length;
  const vizaFoot = activeCount === 0 ? "нет активных"
    : expiringVisa ? `ближайшая — ${dl(expiringVisa)} дн.` : "всё в порядке";
  const vizaDelta = activeVisas.filter(v => dl(v) <= 30).length > 0 ? `${activeVisas.filter(v => dl(v) <= 30).length} истекает` : null;
  return (
    <div className="stats-row">
      <StatCard label="Избранное" value={favCount} delta={favCount > 0 ? null : null} accent="amber" foot="мест в списке желаний"/>
      <StatCard label="Посещено стран" value={visitedCount} accent="green" foot={`из 195 · ${Math.round(visitedCount / 195 * 100)}% мира`}/>
      <StatCard label="Активных виз" value={activeCount} delta={vizaDelta} accent={vizaDelta ? "amber" : "green"} foot={vizaFoot}/>
      <StatCard label="Маршруты" value="—" foot="скоро"/>
    </div>
  );
}

function FlagDot({ iso }) {
  // Tiny generated chip — just a colored square keyed off the ISO so it's stable.
  let h = 0;
  for (let i = 0; i < iso.length; i++) h = (h * 31 + iso.charCodeAt(i)) % 360;
  return (
    <div className="flag-dot" style={{
      background: `linear-gradient(135deg, hsl(${h} 35% 30%), hsl(${(h + 40) % 360} 30% 22%))`
    }}>
      <span>{iso}</span>
    </div>
  );
}

function VisaCard({ visas, onAdd, onDelete }) {
  const [showForm, setShowForm] = React.useState(false);
  const [vCountry, setVCountry] = React.useState("");
  const [vEntry, setVEntry] = React.useState("");
  const [vAllowed, setVAllowed] = React.useState("90");
  const now = Date.now();
  const dl = v => Math.ceil((new Date(v.entry).getTime() + v.allowed*86400000 - now)/86400000);

  const getStatus = (v) => {
    const left = dl(v);
    if (left <= 0) return { label: "Истекла", cls: "amber" };
    if (left <= 30) return { label: "Истекает", cls: "amber" };
    return { label: "Активна", cls: "green" };
  };

  const handleAdd = async () => {
    if (!vCountry || !vEntry || !vAllowed) return;
    await onAdd(vCountry, vEntry, vAllowed);
    setShowForm(false); setVCountry(""); setVEntry(""); setVAllowed("90");
  };

  return (
    <div className="card half-card">
      <div className="card-head">
        <div>
          <div className="card-eyebrow">Документы</div>
          <h3 className="card-title">Трекер виз</h3>
        </div>
        <button className="ghost-btn" onClick={() => setShowForm(!showForm)}>
          {showForm ? "Отмена" : "+ Добавить"}
        </button>
      </div>

      {showForm && (
        <div style={{background:"#1a1a17",borderRadius:10,padding:"12px 14px",marginBottom:14,display:"flex",flexDirection:"column",gap:8}}>
          <select value={vCountry} onChange={e=>setVCountry(e.target.value)}
            style={{padding:"8px 10px",background:"#252521",border:"1.5px solid #2c2c26",borderRadius:8,color:"#ece9df",fontFamily:"var(--sans)",fontSize:13,outline:"none"}}>
            <option value="">Выбери страну</option>
            {Object.entries(COUNTRY_NAMES_RU).sort((a,b)=>a[1].localeCompare(b[1])).map(([iso,name])=>(
              <option key={iso} value={iso}>{name} ({iso})</option>
            ))}
          </select>
          <div style={{display:"flex",gap:8}}>
            <input type="date" value={vEntry} onChange={e=>setVEntry(e.target.value)}
              style={{flex:1,padding:"8px 10px",background:"#252521",border:"1.5px solid #2c2c26",borderRadius:8,color:"#ece9df",fontFamily:"var(--sans)",fontSize:13,outline:"none"}}/>
            <input type="number" placeholder="Дней" value={vAllowed} onChange={e=>setVAllowed(e.target.value)} min="1" max="365"
              style={{width:80,padding:"8px 10px",background:"#252521",border:"1.5px solid #2c2c26",borderRadius:8,color:"#ece9df",fontFamily:"var(--sans)",fontSize:13,outline:"none"}}/>
          </div>
          <button onClick={handleAdd}
            style={{padding:"8px",background:"var(--accent)",border:"none",borderRadius:8,color:"#0c1f17",fontWeight:700,fontSize:13,fontFamily:"var(--sans)",cursor:"pointer"}}>
            Добавить
          </button>
        </div>
      )}

      <ul className="visa-list">
        {(visas||[]).map((v, idx) => {
          const m = getStatus(v);
          const left = dl(v);
          const pct = Math.max(4, Math.min(100, (left / v.allowed) * 100));
          const iso = v.country || v.iso || "???";
          return (
            <li key={idx} className="visa-row" style={{position:"relative"}}>
              <div className="visa-iso">
                <FlagDot iso={iso}/>
              </div>
              <div className="visa-text">
                <div className="visa-top">
                  <span className="visa-name">{COUNTRY_NAMES_RU[iso] || iso}</span>
                  <span className={`pill ${m.cls}`}>{m.label}</span>
                </div>
                <div className="visa-meta">Въезд: {v.entry} · {v.allowed} дн.</div>
                <div className="visa-bar">
                  <div className={`visa-bar-fill ${m.cls}`} style={{ width: `${pct}%` }}/>
                </div>
              </div>
              <div className="visa-days" style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}>
                <b style={{fontFamily:"var(--serif)",fontSize:22,fontWeight:600,color:left<=30?"var(--amber)":"var(--text)"}}>{Math.max(0,left)}</b>
                <span style={{fontFamily:"var(--sans)",fontSize:10,color:"var(--text-3)",textTransform:"uppercase",letterSpacing:"0.1em"}}>дн.</span>
                <button onClick={()=>onDelete(idx)} style={{fontSize:10,color:"var(--text-3)",background:"none",border:"none",cursor:"pointer",marginTop:2,fontFamily:"var(--sans)"}}>удалить</button>
              </div>
            </li>
          );
        })}
        {(!visas || visas.length===0) && <li style={{padding:"20px 0",textAlign:"center",color:"var(--text-3)",fontSize:13}}>Нет виз · нажмите "+ Добавить"</li>}
      </ul>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// World map
// ─────────────────────────────────────────────────────────────────────────────
function WorldMap({ visited, favorites, onPick }) {
  const [topo, setTopo] = useState(null);
  const [hover, setHover] = useState(null); // {iso, name, x, y}
  const [error, setError] = useState(null);
  const wrapRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    // Topology, fetched at runtime. Antarctica filtered, no labels.
    const url = (window.__resources && window.__resources.worldAtlas) || "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json";
    fetch(url)
      .then((r) => r.json())
      .then((data) => {
        if (!cancelled) setTopo(data);
      })
      .catch((e) => !cancelled && setError(String(e)));
    return () => { cancelled = true; };
  }, []);

  const paths = useMemo(() => {
    if (!topo || !window.topojson || !window.d3) return null;
    const countries = window.topojson.feature(topo, topo.objects.countries);
    // Robinson-ish via geoNaturalEarth1
    const projection = window.d3.geoNaturalEarth1()
      .scale(180)
      .translate([500, 250]);
    const pathGen = window.d3.geoPath(projection);

    // numeric-id → ISO-A3 lookup. world-atlas uses numeric M49 codes.
    const ID_TO_ISO = window.NUM_TO_ISO || {};

    return countries.features
      .filter((f) => f.properties.name !== "Antarctica" && String(f.id) !== "010")
      .map((f, i) => {
        const iso = ID_TO_ISO[String(f.id).padStart(3, "0")] || null;
        return {
          id: f.id,
          key: `${f.id ?? "x"}-${iso ?? "x"}-${i}`,
          iso,
          name: f.properties.name,
          d: pathGen(f),
        };
      });
  }, [topo]);

  function classify(iso) {
    if (!iso) return "none";
    if (visited.has(iso)) return "visited";
    if (favorites.has(iso)) return "favorite";
    return "none";
  }

  function handleEnter(e, p) {
    const rect = wrapRef.current.getBoundingClientRect();
    setHover({
      iso: p.iso,
      name: COUNTRY_NAMES_RU[p.iso] || p.name,
      x: e.clientX - rect.left,
      y: e.clientY - rect.top,
      status: classify(p.iso),
    });
  }

  return (
    <div className="card map-card" ref={wrapRef}>
      <div className="card-head map-head">
        <div>
          <div className="card-eyebrow">Карта мира</div>
          <h3 className="card-title">Где я был</h3>
        </div>
        <div className="legend">
          <span className="legend-item"><i className="sw green"/> Посещено</span>
          <span className="legend-item"><i className="sw amber"/> Избранное</span>
          <span className="legend-item"><i className="sw gray"/> Не посещено</span>
        </div>
      </div>

      <div className="map-wrap">
        {!paths && !error && <div className="map-loading">Загружаем карту мира…</div>}
        {error && <div className="map-loading err">Не удалось загрузить карту: {error}</div>}
        {paths && (
          <svg viewBox="0 0 1000 500" className="world-svg" preserveAspectRatio="xMidYMid meet">
            <defs>
              <radialGradient id="oceanGrad" cx="50%" cy="50%" r="70%">
                <stop offset="0%" stopColor="#191917"/>
                <stop offset="100%" stopColor="#0e0e0c"/>
              </radialGradient>
              <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <rect width="1000" height="500" fill="url(#oceanGrad)"/>
            {/* graticule */}
            <g className="graticule" stroke="#23231f" strokeWidth="0.4" fill="none" opacity="0.6">
              {Array.from({ length: 11 }).map((_, i) => (
                <line key={`v${i}`} x1={i * 100} y1="0" x2={i * 100} y2="500"/>
              ))}
              {Array.from({ length: 6 }).map((_, i) => (
                <line key={`h${i}`} x1="0" y1={i * 100} x2="1000" y2={i * 100}/>
              ))}
            </g>
            <g className="countries">
              {paths.map((p) => {
                const status = classify(p.iso);
                return (
                  <path
                    key={p.key}
                    d={p.d}
                    className={`country ${status}`}
                    onMouseEnter={(e) => handleEnter(e, p)}
                    onMouseMove={(e) => handleEnter(e, p)}
                    onMouseLeave={() => setHover(null)}
                    onClick={() => p.iso && onPick(p.iso, COUNTRY_NAMES_RU[p.iso] || p.name)}
                  />
                );
              })}
            </g>
          </svg>
        )}

        {hover && (
          <div className="map-tip" style={{ left: hover.x + 12, top: hover.y + 12 }}>
            <div className="tip-name">{hover.name}</div>
            <div className={`tip-status ${hover.status}`}>
              {hover.status === "visited" && "Посещено"}
              {hover.status === "favorite" && "В избранном"}
              {hover.status === "none" && "Не посещено · нажмите, чтобы отметить"}
            </div>
          </div>
        )}
      </div>

      <div className="map-foot">
        <div className="map-stat"><b>{visited.size}</b><span>стран посещено</span></div>
        <div className="map-stat"><b>{favorites.size}</b><span>в избранном</span></div>
        <div className="map-stat"><b>5</b><span>континентов</span></div>
        <div className="map-stat"><b>164k</b><span>км пройдено</span></div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Achievements row
// ─────────────────────────────────────────────────────────────────────────────
function Achievements({ visited }) {
  const n = visited ? visited.size : 0;
  const achvList = [
    { id:"first", title:"Первая поездка", sub:"1+ страна", icon:"compass", unlocked: n>=1 },
    { id:"explorer", title:"Исследователь", sub:"10+ стран", icon:"globe", unlocked: n>=10 },
    { id:"globetrotter", title:"Глобтроттер", sub:"25+ стран", icon:"medal", unlocked: n>=25 },
    { id:"arctic", title:"Полярник", sub:"50+ стран", icon:"snow", unlocked: n>=50 },
    { id:"continents", title:"5 континентов", sub:"Все регионы", icon:"layers", unlocked: n>=75 },
    { id:"stamps", title:"Коллекционер", sub:"100+ стран", icon:"stamp", unlocked: n>=100 },
  ];
  const unlocked = achvList.filter(a => a.unlocked).length;
  return (
    <div className="card achv-card">
      <div className="card-head">
        <div>
          <div className="card-eyebrow">Прогресс</div>
          <h3 className="card-title">Достижения</h3>
        </div>
        <div className="achv-progress">
          <span>{unlocked} / {achvList.length}</span>
          <div className="achv-bar"><div className="achv-bar-fill" style={{ width: `${unlocked/achvList.length*100}%` }}/></div>
        </div>
      </div>
      <div className="achv-row">
        {achvList.map((a) => (
          <div key={a.id} className={`achv ${a.unlocked ? "on" : "off"}`}>
            <div className="achv-icon"><Icon name={a.icon} size={22}/></div>
            <div className="achv-text">
              <div className="achv-title">{a.title}</div>
              <div className="achv-sub">{a.sub}</div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Modal
// ─────────────────────────────────────────────────────────────────────────────
function MarkModal({ open, country, currentStatus, onClose, onMark }) {
  if (!open) return null;
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}><Icon name="close" size={16}/></button>
        <div className="modal-eyebrow">Страна</div>
        <h2 className="modal-title">{country?.name}</h2>
        <div className="modal-meta">Текущий статус:&nbsp;
          <span className={`pill ${currentStatus === "visited" ? "green" : currentStatus === "favorite" ? "amber" : "muted"}`}>
            {currentStatus === "visited" ? "Посещено" : currentStatus === "favorite" ? "В избранном" : "Не отмечено"}
          </span>
        </div>

        <div className="modal-actions">
          <button className="modal-btn green" onClick={() => onMark("visited")}>
            <Icon name="check" size={16}/>
            <div>
              <div className="ma-title">Отметить как посещённую</div>
              <div className="ma-sub">Добавить в журнал поездок</div>
            </div>
          </button>
          <button className="modal-btn amber" onClick={() => onMark("favorite")}>
            <Icon name="heart" size={16}/>
            <div>
              <div className="ma-title">В избранное</div>
              <div className="ma-sub">Список желаний</div>
            </div>
          </button>
          <button className="modal-btn ghost" onClick={() => onMark("none")}>
            <Icon name="close" size={16}/>
            <div>
              <div className="ma-title">Снять отметку</div>
              <div className="ma-sub">Убрать из всех списков</div>
            </div>
          </button>
        </div>

        <div className="modal-foot">
          <span>Соседние посещены:</span>
          <span className="dim">3 из 8</span>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────────────────────
// Tweaks
// ─────────────────────────────────────────────────────────────────────────────
const DEFAULT_TWEAKS = /*EDITMODE-BEGIN*/{
  "accent": "#3fbb89",
  "amber": "#f0a54a",
  "bg": "#131310",
  "card": "#1f1f1b",
  "border": "#2c2c26",
  "density": "comfy",
  "showGraticule": true,
  "glowOnHover": true
}/*EDITMODE-END*/;

// ─────────────────────────────────────────────────────────────────────────────
// App
// ─────────────────────────────────────────────────────────────────────────────
// ── Toast helper ──────────────────────────────────────────────
function showToast(msg) {
  let c = document.getElementById("toast-container");
  if (!c) {
    c = document.createElement("div");
    c.id = "toast-container";
    c.className = "toast-container";
    document.body.appendChild(c);
  }
  const t = document.createElement("div");
  t.className = "toast-msg";
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = "0"; t.style.transform = "translateY(10px)"; t.style.transition = "all .2s"; setTimeout(() => t.remove(), 200); }, 2200);
}

function App() {
  const [tweaks, setTweak] = useTweaks(DEFAULT_TWEAKS);
  const [active, setActive] = useState("overview");
  const [visited, setVisited] = useState(new Set());
  const [favorites, setFavorites] = useState(new Set());
  const [visas, setVisas] = useState([]);
  const [modal, setModal] = useState(null);
  const [user, setUser] = useState(null);
  const [userDoc, setUserDoc] = useState({});
  const [fbReady, setFbReady] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [searchQ, setSearchQ] = useState("");

  const auth = window.__fbAuth;
  const db   = window.__fbDb;

  // ── Firebase auth ──────────────────────────────────────────
  useEffect(() => {
    if (!auth) return;
    const unsub = auth.onAuthStateChanged(async (u) => {
      if (!u) { window.location.href = "login.html"; return; }
      setUser(u);
      const snap = await db.collection("users").doc(u.uid).get();
      const d = snap.exists ? snap.data() : {};
      d.visited   = d.visited   || [];
      d.favorites = d.favorites || [];
      d.visas     = d.visas     || [];
      d.name      = d.name      || u.displayName || u.email.split("@")[0];
      setUserDoc(d);
      setVisited(new Set(d.visited));
      setFavorites(new Set(d.favorites));
      setVisas(d.visas);
      setFbReady(true);
      // Hide loading
      const ld = document.getElementById("fb-loading");
      if (ld) { ld.style.opacity = "0"; ld.style.transition = "opacity .3s"; setTimeout(() => ld.remove(), 300); }
    });
    return unsub;
  }, []);

  const save = async (patch) => {
    if (!user) return;
    await db.collection("users").doc(user.uid).set(patch, { merge: true });
  };

  // Apply CSS vars from tweaks
  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty("--accent", tweaks.accent);
    r.style.setProperty("--amber", tweaks.amber);
    r.style.setProperty("--bg", tweaks.bg);
    r.style.setProperty("--card", tweaks.card);
    r.style.setProperty("--border", tweaks.border);
    r.style.setProperty("--gap", tweaks.density === "tight" ? "16px" : tweaks.density === "loose" ? "32px" : "24px");
    r.style.setProperty("--graticule", tweaks.showGraticule ? "0.6" : "0");
    r.style.setProperty("--glow", tweaks.glowOnHover ? "1" : "0");
  }, [tweaks]);

  function classify(iso) {
    if (visited.has(iso)) return "visited";
    if (favorites.has(iso)) return "favorite";
    return "none";
  }

  function pickCountry(iso, name) {
    setModal({ iso, name });
  }

  async function applyMark(status) {
    const iso = modal.iso;
    const v = new Set(visited);
    const f = new Set(favorites);
    v.delete(iso); f.delete(iso);
    if (status === "visited")  { v.add(iso); showToast("✓ Добавлено в посещённые"); }
    if (status === "favorite") { f.add(iso); showToast("♥ Добавлено в избранное"); }
    if (status === "none")     { showToast("Отметка снята"); }
    setVisited(v); setFavorites(f);
    await save({ visited: [...v], favorites: [...f] });
    setModal(null);
  }

  async function addVisa(country, entry, allowed) {
    const newVisa = { country, entry, allowed: parseInt(allowed) };
    const updated = [...visas, newVisa];
    setVisas(updated);
    await save({ visas: updated });
    showToast("Виза добавлена ✓");
  }

  async function deleteVisa(idx) {
    const updated = visas.filter((_, i) => i !== idx);
    setVisas(updated);
    await save({ visas: updated });
    showToast("Виза удалена");
  }

  function handleLogout() {
    auth.signOut().then(() => window.location.href = "login.html");
  }

  // Search countries helper
  const allCountries = Object.entries(COUNTRY_NAMES_RU).map(([iso, name]) => ({ iso, name }));
  const filteredCountries = searchQ.length > 0
    ? allCountries.filter(c => c.name.toLowerCase().includes(searchQ.toLowerCase()) || c.iso.toLowerCase().includes(searchQ.toLowerCase())).slice(0, 30)
    : allCountries.slice(0, 20);

  if (!fbReady) return null;

  return (
    <div className="app">
      <Sidebar active={active} onNav={setActive} user={user} userDoc={userDoc} visited={visited} onLogout={handleLogout}/>
      <main className="main">
        <div className="main-inner">
          <Topbar onNewTrip={() => setSearchOpen(true)}/>
          <StatsRow visitedCount={visited.size} favCount={favorites.size} visas={visas}/>
          <div className="halves">
            <FavoritesCard favorites={favorites} onOpen={(iso) => pickCountry(iso, COUNTRY_NAMES_RU[iso] || iso)}/>
            <VisaCard visas={visas} onAdd={addVisa} onDelete={deleteVisa}/>
          </div>
          <WorldMap visited={visited} favorites={favorites} onPick={pickCountry}/>
          <Achievements visited={visited}/>
          <footer className="foot">
            <span>CheckTheWorld · версия 4.2</span>
            <span className="dim">Последняя поездка: Япония, март 2026</span>
          </footer>
        </div>
      </main>

      <MarkModal
        open={!!modal}
        country={modal}
        currentStatus={modal ? classify(modal.iso) : "none"}
        onClose={() => setModal(null)}
        onMark={applyMark}
      />

      {searchOpen && (
        <div className="modal-backdrop" onClick={() => setSearchOpen(false)}>
          <div className="modal" onClick={e => e.stopPropagation()} style={{width:520}}>
            <button className="modal-close" onClick={() => setSearchOpen(false)}><Icon name="close" size={16}/></button>
            <div className="modal-eyebrow">Добавить поездку</div>
            <h2 className="modal-title">Новая поездка</h2>
            <div className="search-input-wrap">
              <Icon name="search" size={16}/>
              <input autoFocus placeholder="Страна — Таиланд, Франция, Япония..." value={searchQ} onChange={e => setSearchQ(e.target.value)}/>
            </div>
            <div className="search-results">
              {filteredCountries.map(c => {
                const st = classify(c.iso);
                return (
                  <div key={c.iso} className="search-result-row" onClick={async () => {
                    const v = new Set(visited); v.add(c.iso);
                    setVisited(v);
                    await save({ visited: [...v] });
                    showToast(`✓ ${c.name} добавлена в посещённые`);
                    setSearchOpen(false); setSearchQ("");
                  }}>
                    <FlagDot iso={c.iso}/>
                    <div>
                      <div className="sr-name">{c.name}</div>
                      <div className="sr-status">{st === "visited" ? "✓ Уже посещено" : st === "favorite" ? "♥ В избранном" : "Не посещено · нажмите чтобы отметить"}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      <TweaksPanel title="Tweaks">
        <TweakSection title="Палитра">
          <TweakColor label="Фон" value={tweaks.bg} onChange={(v) => setTweak("bg", v)}/>
          <TweakColor label="Карточка" value={tweaks.card} onChange={(v) => setTweak("card", v)}/>
          <TweakColor label="Граница" value={tweaks.border} onChange={(v) => setTweak("border", v)}/>
          <TweakColor label="Зелёный" value={tweaks.accent} onChange={(v) => setTweak("accent", v)}/>
          <TweakColor label="Янтарный" value={tweaks.amber} onChange={(v) => setTweak("amber", v)}/>
        </TweakSection>
        <TweakSection title="Раскладка">
          <TweakRadio
            label="Плотность"
            value={tweaks.density}
            options={[{label: "Компактно", value: "tight"}, {label: "Удобно", value: "comfy"}, {label: "Просторно", value: "loose"}]}
            onChange={(v) => setTweak("density", v)}
          />
          <TweakToggle label="Сетка на карте" value={tweaks.showGraticule} onChange={(v) => setTweak("showGraticule", v)}/>
          <TweakToggle label="Свечение при наведении" value={tweaks.glowOnHover} onChange={(v) => setTweak("glowOnHover", v)}/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</head>
<body>
<div id="fb-loading">
  <div class="ll">CheckTheWorld.</div>
  <div class="ls"></div>
</div>
<div id="root"></div>

</body></html>
